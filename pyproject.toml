[project]
name = "python-rag-framework"
version = "0.1.0"
description = "A lightweight Python framework for building retrieval-augmented generation applications."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Adrien" },
]
keywords = [
    "rag",
    "retrieval-augmented-generation",
    "semantic-search",
    "llm",
    "python",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.8,<3",
]

[project.urls]
Homepage = "https://github.com/lelouchzr/python-rag-framework"
Repository = "https://github.com/lelouchzr/python-rag-framework"
Issues = "https://github.com/lelouchzr/python-rag-framework/issues"
Documentation = "https://github.com/lelouchzr/python-rag-framework/tree/main/docs"

[project.scripts]
rag = "rag.cli:main"

[project.optional-dependencies]
anthropic = [
    "anthropic>=0.34",
]
docx = [
    "python-docx>=1.1,<2",
]
dev = [
    "build>=1.2",
    "mkdocs-material>=9.5",
    "mypy>=1.10",
    "pypdf>=5.0,<7",
    "pytest>=8.2",
    "python-docx>=1.1,<2",
    "ruff>=0.5",
]
ocr = [
    "pillow>=10.0",
    "pytesseract>=0.3",
]
openai = [
    "openai>=1.0",
]
pdf = [
    "pypdf>=5.0,<7",
]
providers = [
    "anthropic>=0.34",
    "openai>=1.0",
]
all = [
    "anthropic>=0.34",
    "openai>=1.0",
    "pillow>=10.0",
    "pypdf>=5.0,<7",
    "pytesseract>=0.3",
    "python-docx>=1.1,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/benchmarks",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "UP",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
